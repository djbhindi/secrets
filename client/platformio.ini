[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 460800
build_src_filter = +<*> -<sd_card_check.cpp> -<audio_check.cpp> -<dial_check.cpp>

[env:sd-card-check]
extends = env:esp32doit-devkit-v1
build_src_filter = -<*> +<sd_card_check.cpp>
monitor_speed = 115200

[env:audio-check]
extends = env:esp32doit-devkit-v1
build_src_filter = -<*> +<audio_check.cpp>
monitor_speed = 115200

[env:dial-check]
extends = env:esp32doit-devkit-v1
build_src_filter = -<*> +<dial_check.cpp>
monitor_speed = 115200
